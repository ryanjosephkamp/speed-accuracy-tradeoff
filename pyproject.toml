[project]
name = "speed-accuracy-tradeoff"
version = "0.1.0"
description = "Optimal decision bounds for the speed-accuracy trade-off, computed exactly and tested."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[dependency-groups]
dev = ["pytest>=8"]
experiments = [
    "segno>=1.6.6",
    "zxing-cpp>=3.1.1",
]
paper = [
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speed_accuracy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
